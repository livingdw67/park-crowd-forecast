name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline-and-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # what the public app deploys on
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            databricks/requirements.txt
            public_app/requirements.txt
      - run: pip install -r requirements-dev.txt -r public_app/requirements.txt
      - run: pytest -q tests

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q tests   # synthetic data and a scripted model: no snapshot or API key needed

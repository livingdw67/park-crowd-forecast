resources:
  jobs:
    tune_forecast:
      name: tune-forecast
      # On demand only (no schedule; Free Edition's daily compute quota): an Optuna search, one look at
      # the holdout, and a promotion to champion only on a reliable gain. See src/10_tune_forecast.py.
      #   databricks bundle run tune_forecast --profile free
      timeout_seconds: 5400   # Optuna's own budget is timeout_minutes (30), plus the refit and holdout
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]   # resolved at deploy, so no address in the repo
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: n_trials
          default: "60"
        - name: timeout_minutes
          default: "30"
        - name: trigger
          default: manual   # the daily monitor passes error, drift or backstop when it starts a run
      tasks:
        - task_key: tune
          notebook_task:
            notebook_path: ../src/10_tune_forecast.py
